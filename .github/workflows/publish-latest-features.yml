name: Publish latest features feed

on:
  push:
    branches: [main]
    paths:
      - "latest-features/feed.json"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Build site
        run: |
          node -e "JSON.parse(require('fs').readFileSync('latest-features/feed.json','utf8'))"
          mkdir -p _site
          cp latest-features/feed.json _site/latest-features.json
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
